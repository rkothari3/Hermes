<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 496" width="560" height="496"
     font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#484f58"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="560" height="496" fill="#0d1117"/>

  <!-- header -->
  <text x="280" y="28" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold" letter-spacing="2">HERMES PIPELINE</text>

  <!-- Source -->
  <rect x="155" y="42" width="250" height="42" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="280" y="59" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="bold">ITCH Binary File</text>
  <text x="280" y="75" text-anchor="middle" fill="#6e7681" font-size="10">9 GB · 264M messages · Dec 30 2019</text>

  <!-- arrow 1 -->
  <line x1="280" y1="84" x2="280" y2="108" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="288" y="101" fill="#6e7681" font-size="9">2 MB read buffer</text>

  <!-- Stage 1 -->
  <rect x="85" y="111" width="390" height="60" rx="4" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="280" y="130" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="bold">Stage 1 · ITCH Binary Parser</text>
  <text x="280" y="147" text-anchor="middle" fill="#6e7681" font-size="10">9 message types · big-endian byte-swap · callback dispatch</text>
  <text x="280" y="163" text-anchor="middle" fill="#6e7681" font-size="10">t&#x2080; = rdtsc_start()  ·  src/itch_parser.cpp</text>

  <!-- arrow 2 -->
  <line x1="280" y1="171" x2="280" y2="197" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 2 -->
  <rect x="85" y="200" width="390" height="76" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="280" y="220" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="bold">Stage 2 · Order Book Updater</text>
  <text x="280" y="237" text-anchor="middle" fill="#6e7681" font-size="10">flat Level[8192] arrays · O(1) index by (price &#x2212; base)</text>
  <text x="280" y="253" text-anchor="middle" fill="#6e7681" font-size="10">generation counters · unordered_map order-ref lookup</text>
  <text x="280" y="269" text-anchor="middle" fill="#3fb950" font-size="10">P50 ~80 ns (fast mode)  ·  t&#x2081; = rdtsc_end()  &#x2192;  book.record(t&#x2081;&#x2212;t&#x2080;)</text>

  <!-- arrow 3 -->
  <line x1="280" y1="276" x2="280" y2="302" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 3 -->
  <rect x="85" y="305" width="390" height="76" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="280" y="325" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="bold">Stage 3 · Signal Computer</text>
  <text x="280" y="342" text-anchor="middle" fill="#6e7681" font-size="10">spread · mid-price · microprice (Stoikov) · OBI top-5 levels</text>
  <text x="280" y="358" text-anchor="middle" fill="#6e7681" font-size="10">integer hot path · float only at output  ·  src/signal_engine.cpp</text>
  <text x="280" y="374" text-anchor="middle" fill="#3fb950" font-size="10">P50 38 ns  ·  t&#x2082; = rdtsc_end()  &#x2192;  signal.record(t&#x2082;&#x2212;t&#x2081;)</text>

  <!-- branch: stem then fork -->
  <line x1="280" y1="381" x2="280" y2="405" stroke="#484f58" stroke-width="1.5"/>
  <line x1="160" y1="405" x2="400" y2="405" stroke="#484f58" stroke-width="1.5"/>
  <line x1="160" y1="405" x2="160" y2="431" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="400" y1="405" x2="400" y2="431" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 4a: CSV -->
  <rect x="60" y="434" width="200" height="48" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="160" y="453" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="bold">Stage 4 · CSV Output</text>
  <text x="160" y="470" text-anchor="middle" fill="#6e7681" font-size="10">aapl_signals.csv · 1,177,357 rows</text>

  <!-- Stage 4b: Latency -->
  <rect x="300" y="434" width="200" height="48" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="453" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="bold">Stage 5 · Latency Report</text>
  <text x="400" y="470" text-anchor="middle" fill="#6e7681" font-size="10">P50 / P99 / P99.9 per stage</text>

</svg>
